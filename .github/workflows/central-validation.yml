name: Central Validation

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "style/**"
      - "refactor/**"
      - "perf/**"
      - "test/**"
      - "build/**"
      - "ci/**"
      - "revert/**"

jobs:
  validate:
    name: Validate Next.js app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
