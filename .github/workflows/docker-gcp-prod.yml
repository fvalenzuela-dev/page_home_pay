name: GCP Deploy (PROD)

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Artifact Registry image name"
        required: true
        default: "page-home-pay-prod"
      cloudrun_service:
        description: "Cloud Run service name"
        required: true
        default: "page-home-pay-prod"

jobs:
  build_and_deploy:
    name: Build & Deploy
    permissions:
      contents: read
      id-token: write
    uses: fvalenzuela-dev/.github/.github/workflows/build-and-push-docker-gcp.yml@main
    with:
      image_name: ${{ inputs.image_name }}
      dockerfile_path: "./Dockerfile"
      artifact_registry_region: "us-central1"
      artifact_registry_repository: ${{ inputs.image_name }}
      cloudrun_service: ${{ inputs.cloudrun_service }}
      cloudrun_region: "us-central1"
    secrets:
      gcp_project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}
      gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}
